name: deploying Hexo project to GitHub pages
on:
  push:
    branches:
      - backup # push 到 backup(源码分支) 时触发构建并发布到 master

env:
  TZ: Asia/Shanghai

permissions:
  contents: write # 允许用内置 GITHUB_TOKEN 推送到 master

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source (backup)
        uses: actions/checkout@v4
        with:
          ref: backup

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build (hexo generate)
        run: |
          npx hexo clean
          npx hexo generate

      - name: Deploy public/ to master
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: master
          user_name: shimmerjordan
          user_email: shimmerjordan@foxmail.com
          full_commit_message: 'Build and Deploy from Github Actions'
